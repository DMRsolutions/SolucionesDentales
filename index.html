function todayISO() {
  // OJO: no usar toISOString() aquí — convierte a UTC y en zonas horarias
  // como México (UTC-6) provoca que la fecha "salte" al día siguiente por
  // la tarde/noche. Usamos los componentes de fecha LOCAL en su lugar.
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
}
function formatDate(iso) { const [y,m,d] = iso.split("-").map(Number); return `${d} de ${MONTHS_ES[m-1]}, ${y}`; }
/* Token único por cita, para el enlace de confirmación/reagendado por WhatsApp
   (ver más abajo). No es una contraseña: solo evita que alguien adivine el
   enlace de la cita de otro paciente. */
function generateConfirmToken() {
  if (window.crypto && crypto.randomUUID) return crypto.randomUUID().replace(/-/g, "");
  return `${Math.random().toString(36).slice(2)}${Date.now().toString(36)}`;
}

/* ---------------- Planes del sistema (control del dueño de DMR) ----------------
   Cada doctor tiene un "plan" contratado (documento doctors/{uid}, campo "plan").

// A partir de esta versión el sistema solo maneja dos niveles: Básico y Premium.
// El plan "pro" (nivel intermedio anterior) se deja reconocido aquí únicamente
// para que los doctores que ya lo tenían no pierdan acceso mientras se

const PLAN_RANK = { basico: 0, pro: 1, premium: 1 };
const PLAN_LABELS = { basico: "Básico", pro: "Premium", premium: "Premium" };
const PLAN_ORDER = ["basico", "premium"];
const FEATURE_MIN_PLAN = {

  recordatorios: "premium",     // Colores de proximidad en citas
  citasProximasBanner: "premium", // Aviso/banner de citas próximas al abrir el sistema

const FEATURE_LABELS = {

  inactivityLogout: "Cierre de sesión automático por inactividad",
  alertasPanel: "Alertas de tratamientos pendientes y citas canceladas en el Panel",
};
function hasFeature(plan, feature) {
  const min = FEATURE_MIN_PLAN[feature];
  if (!min) return true;
  return (PLAN_RANK[plan] ?? 0) >= PLAN_RANK[min];
}

/* ---------------- Proximidad de citas (para colores/recordatorios) ---------------- */
function daysUntil(dateISO) {
  const [y1, m1, d1] = todayISO().split("-").map(Number);
  const [y2, m2, d2] = dateISO.split("-").map(Number);
  const t0 = new Date(y1, m1 - 1, d1).getTime();
  const t1 = new Date(y2, m2 - 1, d2).getTime();
  return Math.round((t1 - t0) / 86400000);
}
function proximityInfo(dateISO) {
  const diff = daysUntil(dateISO);
  if (diff < 0) return { bg: "#EDEFF0", fg: "#8A9BA3", label: "Pasada" };
  if (diff === 0) return { bg: "#F7E6E4", fg: RED, label: "Hoy" };
  if (diff === 1) return { bg: "#FBF0DF", fg: AMBER, label: "Mañana" };
  if (diff <= 2) return { bg: "#FBF0DF", fg: AMBER, label: `En ${diff} días` };
  if (diff <= 7) return { bg: "#E3EEF7", fg: "#2A5C8A", label: "Esta semana" };
  return { bg: "#F0F6F6", fg: "#5B7480", label: "" };
}

/* ---------------- WhatsApp (confirmaciones y recordatorios, vía wa.me) ----------------
   No hay backend/API de WhatsApp Business: el enlace abre WhatsApp (web o app) ya
   iniciado con el número del doctor en el dispositivo, con el chat del PACIENTE
   abierto y el mensaje precargado — el doctor solo presiona "Enviar". */
function buildWhatsAppLink(phone, message) {
  const digits = (phone || "").replace(/\D/g, "");
  if (!digits) return null;
  const withCountry = digits.length === 10 ? "52" + digits : digits; // México por defecto
  return `https://wa.me/${withCountry}?text=${encodeURIComponent(message)}`;
}
/* ---- Enlace de confirmación/reagendado (lo abre el PACIENTE, sin iniciar sesión) ----
   Apunta a "confirmar.html" (archivo estático incluido en este mismo proyecto,
   publicado junto con index.html en el mismo sitio). Esa página inicia sesión
   anónima y escribe directo a Firestore — no usa Cloud Functions ni requiere
   plan Blaze; ver reglas de seguridad en firestore.rules y README 5.3.
   El paciente ve dos botones — "Confirmar" y "Necesito reagendar" — y al
   presionar uno, la cita se actualiza sola en Firestore (sin que el doctor
   tenga que tocar nada en la app). El token evita que alguien adivine el
   enlace de otra cita. */
function buildConfirmLink(appointmentId, confirmToken) {
  if (!appointmentId || !confirmToken) return null;
  const base = new URL("confirmar.html", window.location.href).href;
  return `${base}?id=${encodeURIComponent(appointmentId)}&token=${encodeURIComponent(confirmToken)}`;
}
function confirmationMessage({ patientName, dateISO, time, reason, confirmLink }) {
  let msg = `Hola ${patientName}, te confirmamos tu cita dental el ${formatDate(dateISO)} a las ${time}`;
  if (reason) msg += ` (${reason})`;
  msg += `.`;
  msg += confirmLink
    ? ` Para confirmar tu cita o pedir reagendar, entra aquí: ${confirmLink}`
    : ` Si necesitas reagendar, avísanos por este medio.`;
  msg += ` ¡Te esperamos!`;
  return msg;
}
function reminderMessage({ patientName, dateISO, time, confirmLink }) {
  let msg = `Hola ${patientName}, te recordamos tu cita dental el ${formatDate(dateISO)} a las ${time}.`;
  if (confirmLink) msg += ` Si necesitas reagendar, entra aquí: ${confirmLink}`;
  msg += ` ¡Te esperamos!`;
  return msg;
}

    "auth/invalid-credential": "Correo o contraseña incorrectos.",
    "auth/email-already-in-use": "Ya existe una cuenta registrada con ese correo.",
    "auth/weak-password": "La contraseña debe tener al menos 6 caracteres.",
    "auth/too-many-requests": "Demasiados intentos. Intenta de nuevo en unos minutos.",
    "auth/network-request-failed": "Sin conexión a internet. Revisa tu red e intenta de nuevo.",
    "auth/invalid-username": "El usuario debe tener 3–20 caracteres: letras, números, puntos o guiones.",
    "auth/username-taken": "Ese nombre de usuario ya está en uso, elige otro.",
  };
  return map[code] || "Ocurrió un error. Intenta de nuevo.";
}

/* ---------------- Utilidades de fecha para reportes ---------------- */
function startOfWeek(iso) {
  const [y, m, d] = iso.split("-").map(Number);
  const dt = new Date(y, m - 1, d);
  const day = dt.getDay(); // 0=Dom
  const diff = day === 0 ? -6 : 1 - day; // lunes como inicio
  dt.setDate(dt.getDate() + diff);
  return dt;
}
function toISO(dt) { return `${dt.getFullYear()}-${String(dt.getMonth() + 1).padStart(2, "0")}-${String(dt.getDate()).padStart(2, "0")}`; }
function getRange(periodType, refISO) {
  const [y, m, d] = refISO.split("-").map(Number);
  if (periodType === "dia") return { start: refISO, end: refISO, label: `Día — ${formatDate(refISO)}` };
  if (periodType === "semana") {
    const start = startOfWeek(refISO);
    const end = new Date(start); end.setDate(end.getDate() + 6);
    return { start: toISO(start), end: toISO(end), label: `Semana — ${formatDate(toISO(start))} al ${formatDate(toISO(end))}` };
  }
  const start = new Date(y, m - 1, 1);
  const end = new Date(y, m, 0);
  return { start: toISO(start), end: toISO(end), label: `Mes — ${MONTHS_ES[m - 1]} ${y}` };
}

/* =================================================================
   COMPONENTE PRINCIPAL
================================================================= */
function DentalApp() {
  const [currentUser, setCurrentUser] = useState(null);
  const [authLoading, setAuthLoading] = useState(true);
  const [view, setView] = useState("dashboard");
  const [patients, setPatients] = useState([]);
  const [appointments, setAppointments] = useState([]);
  const [payments, setPayments] = useState([]);
  const [treatmentPlans, setTreatmentPlans] = useState([]);
  const [prescriptions, setPrescriptions] = useState([]);
  const [doctorProfile, setDoctorProfile] = useState(null);
  const [isAdmin, setIsAdmin] = useState(false);
  const [activePatientId, setActivePatientId] = useState(null);
  const activePatient = patients.find((p) => p.id === activePatientId) || null;
  const subscriptionPlan = doctorProfile?.plan || "basico";

  // Cierre de sesión automático por inactividad — solo para doctores en plan
  // Premium (ver FEATURE_MIN_PLAN.inactivityLogout). Se reinicia con cualquier
  // interacción del doctor (mouse, teclado, toque o scroll); si no hay ninguna
  // interacción durante INACTIVITY_LIMIT_MS, se cierra la sesión sola.
  useEffect(() => {
    if (!currentUser || !hasFeature(subscriptionPlan, "inactivityLogout")) return;
    const INACTIVITY_LIMIT_MS = 10 * 60 * 1000; // 10 minutos
    let timer = setTimeout(cerrarPorInactividad, INACTIVITY_LIMIT_MS);
    function cerrarPorInactividad() {
      try { sessionStorage.setItem("dmr_logout_reason", "inactividad"); } catch (e) {}
      auth.signOut().catch((err) => console.error("Error al cerrar sesión por inactividad:", err));
    }
    function reiniciarTimer() { clearTimeout(timer); timer = setTimeout(cerrarPorInactividad, INACTIVITY_LIMIT_MS); }
    const eventos = ["mousemove", "mousedown", "keydown", "touchstart", "scroll"];
    eventos.forEach((ev) => window.addEventListener(ev, reiniciarTimer));
    return () => { clearTimeout(timer); eventos.forEach((ev) => window.removeEventListener(ev, reiniciarTimer)); };
  }, [currentUser, subscriptionPlan]);

  // Si el administrador suspende el acceso del doctor (doctors/{uid}.disabled),
  // doctorProfile se actualiza solo (viene de un onSnapshot en tiempo real) y
  // esto cierra la sesión de inmediato, aunque el doctor tenga la app abierta.
  useEffect(() => {
    if (currentUser && doctorProfile?.disabled === true) {
      try { sessionStorage.setItem("dmr_logout_reason", "suspendido"); } catch (e) {}
      auth.signOut().catch((err) => console.error("Error al cerrar sesión por suspensión:", err));
    }
  }, [currentUser, doctorProfile?.disabled]);

  // Escucha el estado de sesión de Firebase Auth (persiste entre recargas y dispositivos).
  useEffect(() => {
    const unsub = auth.onAuthStateChanged((user) => {
      setCurrentUser(user);
      setAuthLoading(false);
      if (!user) {
        setPatients([]); setAppointments([]); setPayments([]); setTreatmentPlans([]); setPrescriptions([]);
        setDoctorProfile(null); setIsAdmin(false); setActivePatientId(null);
      }
    });
    return unsub;
  }, []);

  // Cada vez que se completa un inicio de sesión (incluye recargar la página con una
  // sesión ya activa, o cerrar sesión y volver a entrar sin recargar), la app se
  // posiciona de inmediato en el Panel general, sin importar en qué vista se haya
  // quedado la sesión anterior.
  useEffect(() => {
    if (currentUser) { setView("dashboard"); setActivePatientId(null); }
  }, [currentUser?.uid]);

  // Suscripción en tiempo real a los datos de este usuario en Firestore.
  useEffect(() => {
    if (!currentUser) return;
    const uid = currentUser.uid;
    const unsubPatients = db.collection("patients").where("ownerId", "==", uid)
      .onSnapshot((snap) => setPatients(snap.docs.map((d) => ({ id: d.id, ...d.data() }))),
        (err) => console.error("Error leyendo pacientes:", err));
    const unsubAppointments = db.collection("appointments").where("ownerId", "==", uid)
      .onSnapshot((snap) => setAppointments(snap.docs.map((d) => ({ id: d.id, ...d.data() }))),
        (err) => console.error("Error leyendo citas:", err));
    const unsubPayments = db.collection("payments").where("ownerId", "==", uid)
      .onSnapshot((snap) => setPayments(snap.docs.map((d) => ({ id: d.id, ...d.data() }))),
        (err) => console.error("Error leyendo pagos:", err));
    const unsubTreatmentPlans = db.collection("treatmentPlans").where("ownerId", "==", uid)
      .onSnapshot((snap) => setTreatmentPlans(snap.docs.map((d) => ({ id: d.id, ...d.data() }))),
        (err) => console.error("Error leyendo planes de tratamiento:", err));
    const unsubPrescriptions = db.collection("prescriptions").where("ownerId", "==", uid)
      .onSnapshot((snap) => setPrescriptions(snap.docs.map((d) => ({ id: d.id, ...d.data() }))),
        (err) => console.error("Error leyendo recetas:", err));
    const unsubDoctor = db.collection("doctors").doc(uid)
      .onSnapshot((doc) => setDoctorProfile(doc.exists ? { id: doc.id, ...doc.data() } : null),
        (err) => console.error("Error leyendo el perfil del doctor:", err));
    // El estatus de administrador (dueño del sistema) se checa una sola vez: solo
    // existe el documento admins/{uid} para las cuentas que tú autorices a mano
    // desde Firebase Console.
    db.collection("admins").doc(uid).get()
      .then((doc) => setIsAdmin(doc.exists))
      .catch(() => setIsAdmin(false));
    return () => { unsubPatients(); unsubAppointments(); unsubPayments(); unsubTreatmentPlans(); unsubPrescriptions(); unsubDoctor(); };
  }, [currentUser]);

  function addPatient(patient) {
    db.collection("patients").add({
      ...patient, ownerId: currentUser.uid, odontogram: {}, odontogramNotes: {}, files: [],
      createdAt: firebase.firestore.FieldValue.serverTimestamp(),
    }).catch((err) => console.error("Error al guardar paciente:", err));
  }
  async function deletePatient(id) {
    if (activePatientId === id) setActivePatientId(null);
    try {
      const batch = db.batch();
      batch.delete(db.collection("patients").doc(id));
      const [apptsSnap, paysSnap, plansSnap, rxSnap] = await Promise.all([
        db.collection("appointments").where("ownerId", "==", currentUser.uid).where("patientId", "==", id).get(),
        db.collection("payments").where("ownerId", "==", currentUser.uid).where("patientId", "==", id).get(),
        db.collection("treatmentPlans").where("ownerId", "==", currentUser.uid).where("patientId", "==", id).get(),
        db.collection("prescriptions").where("ownerId", "==", currentUser.uid).where("patientId", "==", id).get(),
      ]);
      apptsSnap.forEach((doc) => batch.delete(doc.ref));
      paysSnap.forEach((doc) => batch.delete(doc.ref));
      plansSnap.forEach((doc) => batch.delete(doc.ref));
      rxSnap.forEach((doc) => batch.delete(doc.ref));
      await batch.commit();
    } catch (err) { console.error("Error al eliminar paciente:", err); }
  }
  function addAppointment(appt) {
    db.collection("appointments").add({
      ...appt, ownerId: currentUser.uid, confirmToken: generateConfirmToken(),
      createdAt: firebase.firestore.FieldValue.serverTimestamp(),
    }).catch((err) => console.error("Error al guardar cita:", err));
  }
  function updateAppointmentStatus(id, status) {
    db.collection("appointments").doc(id).update({ status }).catch((err) => console.error("Error al actualizar cita:", err));
  }
  function deleteAppointment(id) {
    db.collection("appointments").doc(id).delete().catch((err) => console.error("Error al eliminar cita:", err));
  }
  function addPayment(payment) {
    db.collection("payments").add({
      ...payment, ownerId: currentUser.uid, createdAt: firebase.firestore.FieldValue.serverTimestamp(),
    }).catch((err) => console.error("Error al guardar pago:", err));
  }
  function updateTooth(patientId, tooth, state, note) {
    const p = patients.find((pt) => pt.id === patientId);
    if (!p) return;
    const odontogram = { ...p.odontogram };
    if (state === "sano") delete odontogram[tooth]; else odontogram[tooth] = state;
    const odontogramNotes = { ...(p.odontogramNotes || {}) };
    if (note && note.trim()) odontogramNotes[tooth] = note.trim(); else delete odontogramNotes[tooth];
    db.collection("patients").doc(patientId).update({ odontogram, odontogramNotes })
      .catch((err) => console.error("Error al actualizar odontograma:", err));
  }
  function addFile(patientId, file) {
    db.collection("patients").doc(patientId).update({
      files: firebase.firestore.FieldValue.arrayUnion({ ...file, id: "f" + Date.now() }),
    }).catch((err) => console.error("Error al guardar archivo:", err));
  }
  function addTreatmentPlan(patientId, planData) {
    db.collection("treatmentPlans").add({
      ...planData, patientId, ownerId: currentUser.uid,
      createdAt: firebase.firestore.FieldValue.serverTimestamp(),
    }).catch((err) => console.error("Error al guardar plan de tratamiento:", err));
  }
  function updateTreatmentPlanStatus(id, status) {
    db.collection("treatmentPlans").doc(id).update({ status }).catch((err) => console.error("Error al actualizar plan:", err));
  }
  function deleteTreatmentPlan(id) {
    db.collection("treatmentPlans").doc(id).delete().catch((err) => console.error("Error al eliminar plan:", err));
  }
  // Las recetas llevan un folio consecutivo por doctor (doctors/{uid}.recetaCounter).
  // Se usa una transacción para que el número nunca se repita ni se salte, aunque
  // se generen dos recetas casi al mismo tiempo.
  async function addPrescription(patientId, data) {
    try {
      const doctorRef = db.collection("doctors").doc(currentUser.uid);
      const prescRef = db.collection("prescriptions").doc();
      await db.runTransaction(async (tx) => {
        const doctorSnap = await tx.get(doctorRef);
        const nextNumber = ((doctorSnap.data() && doctorSnap.data().recetaCounter) || 0) + 1;
        tx.set(doctorRef, { recetaCounter: nextNumber }, { merge: true });
        tx.set(prescRef, {
          ...data, patientId, ownerId: currentUser.uid, number: nextNumber,
          createdAt: firebase.firestore.FieldValue.serverTimestamp(),
        });
      });
    } catch (err) { console.error("Error al guardar receta:", err); }
  }
  function deletePrescription(id) {
    db.collection("prescriptions").doc(id).delete().catch((err) => console.error("Error al eliminar receta:", err));
  }
  function saveDoctorSettings(data) {
    db.collection("doctors").doc(currentUser.uid).set(data, { merge: true })
      .catch((err) => console.error("Error al guardar ajustes:", err));
  }
  // Activa notificaciones push en ESTE dispositivo: pide permiso al navegador,
  // registra el service worker de mensajería y guarda el token resultante en
  // doctors/{uid}.fcmTokens (un doctor puede tener varios dispositivos/tokens
  // activos a la vez — celular, computadora, etc.). El HORARIO de los avisos
  // (día antes / mismo día) lo define el administrador desde "Administración",
  // no cada doctor.
  async function activarNotificacionesPush() {
    if (!messaging) throw new Error("Este navegador no soporta notificaciones push.");
    const permiso = await Notification.requestPermission();
    if (permiso !== "granted") throw new Error("Debes permitir las notificaciones para activarlas.");
    const registration = await navigator.serviceWorker.register("./firebase-messaging-sw.js");
    const token = await messaging.getToken({ vapidKey: VAPID_KEY, serviceWorkerRegistration: registration });
    if (!token) throw new Error("No se pudo obtener el token de notificaciones.");
    await db.collection("doctors").doc(currentUser.uid)
      .set({ fcmTokens: firebase.firestore.FieldValue.arrayUnion(token) }, { merge: true });
    return token;
  }
  function handleLogout() { auth.signOut(); }

  if (authLoading) {
    return (
      <div style={{ minHeight: "100vh", display: "flex", alignItems: "center", justifyContent: "center", background: NAVY_DEEP, color: "#EAF2F2", fontSize: 14 }}>
        Cargando…
      </div>
    );
  }

  if (!currentUser) {
    return <AuthScreen />;
  }

  const goToView = (v) => { setView(v); setActivePatientId(null); };

  return (
    <div className="app-shell" style={{ display: "flex", minHeight: "100vh", background: BG, color: NAVY_DEEP }}>
      <Sidebar view={view} setView={goToView} currentUser={currentUser} onLogout={handleLogout} isAdmin={isAdmin} />
      <MobileTopBar currentUser={currentUser} onLogout={handleLogout} />
      <main className="app-main" style={{ flex: 1, padding: "32px 40px", minWidth: 0 }}>
        {view === "dashboard" && (
          <Dashboard patients={patients} appointments={appointments} payments={payments} treatmentPlans={treatmentPlans}
            subscriptionPlan={subscriptionPlan}
            goToPatients={() => setView("pacientes")} goToCitas={() => setView("citas")}
            onSelectPatient={(id) => { setView("pacientes"); setActivePatientId(id); }} />
        )}
        {view === "pacientes" && !activePatient && (
          <PatientsList patients={patients} onSelect={(id) => setActivePatientId(id)} onAdd={addPatient} onDelete={deletePatient} />
        )}
        {view === "pacientes" && activePatient && (
          <PatientDetail patient={activePatient}
            appointments={appointments.filter((a) => a.patientId === activePatient.id)}
            payments={payments.filter((p) => p.patientId === activePatient.id)}
            treatmentPlans={treatmentPlans.filter((t) => t.patientId === activePatient.id)}
            prescriptions={prescriptions.filter((r) => r.patientId === activePatient.id)}
            doctorProfile={doctorProfile}
            subscriptionPlan={subscriptionPlan}
            onBack={() => setActivePatientId(null)}
            onUpdateTooth={(tooth, state, note) => updateTooth(activePatient.id, tooth, state, note)}
            onAddAppointment={addAppointment} onAddPayment={addPayment}
            onAddFile={(file) => addFile(activePatient.id, file)}
            onAddTreatmentPlan={(data) => addTreatmentPlan(activePatient.id, data)}
            onUpdateTreatmentPlanStatus={updateTreatmentPlanStatus}
            onDeleteTreatmentPlan={deleteTreatmentPlan}
            onAddPrescription={(data) => addPrescription(activePatient.id, data)}
            onDeletePrescription={deletePrescription} />
        )}
        {view === "citas" && (
          <CitasView appointments={appointments} patients={patients} subscriptionPlan={subscriptionPlan}
            onAdd={addAppointment} onUpdateStatus={updateAppointmentStatus} onDelete={deleteAppointment} />
        )}
        {view === "reportes" && (
          <ReportsView appointments={appointments} payments={payments} patients={patients} />
        )}
        {view === "ajustes" && (
          <SettingsView profile={doctorProfile} plan={subscriptionPlan} onSave={saveDoctorSettings}
            currentUid={currentUser.uid} onActivarNotificaciones={activarNotificacionesPush} />
        )}
        {view === "admin" && isAdmin && (
          <AdminView currentUid={currentUser.uid} />
        )}
      </main>
      <BottomNav view={view} setView={goToView} isAdmin={isAdmin} />
    </div>
  );
}

/* Umbral de "paciente sin regresar": cuántos días sin una cita para que
   aparezca en la lista de seguimiento. Ajustable aquí en un solo lugar. */
const DIAS_SIN_REGRESAR = 90;

/* Calcula, para cada paciente, su última cita pasada (no cancelada) y si
   tiene alguna cita futura agendada. Un paciente aparece como "sin regresar"
   si tuvo al menos una visita, no tiene ninguna cita futura, y su última
   visita fue hace DIAS_SIN_REGRESAR días o más. */
function calcularPacientesSinRegresar(patients, appointments, today) {
  const hoyTime = new Date(today.slice(0, 4), Number(today.slice(5, 7)) - 1, today.slice(8, 10)).getTime();
  return patients.map((p) => {
    const citasPaciente = appointments.filter((a) => a.patientId === p.id && a.status !== "cancelada");
    const pasadas = citasPaciente.filter((a) => a.date < today).sort((a, b) => b.date.localeCompare(a.date));
    const tieneFutura = citasPaciente.some((a) => a.date >= today);
    if (pasadas.length === 0 || tieneFutura) return null;
    const ultima = pasadas[0].date;
    const ultimaTime = new Date(ultima.slice(0, 4), Number(ultima.slice(5, 7)) - 1, ultima.slice(8, 10)).getTime();
    const dias = Math.round((hoyTime - ultimaTime) / 86400000);
    if (dias < DIAS_SIN_REGRESAR) return null;
    return { patient: p, dias, ultima };
  }).filter(Boolean).sort((a, b) => b.dias - a.dias);
}

/* Saldo pendiente por paciente: suma de (total del plan - abonado) de todos
   sus planes de tratamiento, igual que se calcula en la pestaña Pagos. */
function calcularPacientesConSaldo(patients, payments, treatmentPlans) {
  return patients.map((p) => {
    const planesPaciente = treatmentPlans.filter((t) => t.patientId === p.id);
    const saldo = planesPaciente.reduce((s, pl) => {
      const totalPlan = (pl.items || []).reduce((s2, it) => s2 + (Number(it.cost) || 0), 0);
      const abonado = payments.filter((pay) => pay.planId === pl.id).reduce((s2, pay) => s2 + (Number(pay.paid) || 0), 0);
      return s + Math.max(0, totalPlan - abonado);
    }, 0);
    return saldo > 0 ? { patient: p, saldo } : null;
  }).filter(Boolean).sort((a, b) => b.saldo - a.saldo);
}

/* Pacientes con al menos una cita cancelada, con el conteo. */
function calcularPacientesConCancelaciones(patients, appointments) {
  return patients.map((p) => {
    const canceladas = appointments.filter((a) => a.patientId === p.id && a.status === "cancelada").length;
    return canceladas > 0 ? { patient: p, canceladas } : null;
  }).filter(Boolean).sort((a, b) => b.canceladas - a.canceladas);
}

  const citasHoy = appointments.filter((a) => a.date === today && a.status !== "cancelada")
    .sort((a, b) => a.time.localeCompare(b.time));

  const coloresActivos = hasFeature(subscriptionPlan, "recordatorios");
  const bannerDisponible = hasFeature(subscriptionPlan, "citasProximasBanner");
  const costosDisponibles = hasFeature(subscriptionPlan, "planesTratamiento");
  const alertasAvanzadas = hasFeature(subscriptionPlan, "alertasPanel");

  const sinRegresar = calcularPacientesSinRegresar(patients, appointments, today);
  const tratamientosPendientes = alertasAvanzadas ? treatmentPlans.filter((t) => t.status === "en_progreso") : [];
  const presupuestosSinAceptar = costosDisponibles ? treatmentPlans.filter((t) => t.status === "propuesto") : [];
  const conSaldo = costosDisponibles ? calcularPacientesConSaldo(patients, payments, treatmentPlans) : [];
  const conCancelaciones = alertasAvanzadas ? calcularPacientesConCancelaciones(patients, appointments) : [];

  return (
    <div>
      <PageHeader title="Panel general" subtitle="Resumen de tu consultorio hoy" />
      {bannerDisponible && <CitasProximasBanner appointments={appointments} patients={patients} />}
      <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(150px, 1fr))", gap: 14, marginBottom: 28 }}>

        <StatCard icon={Clock} label="Sin regresar" value={sinRegresar.length} color={AMBER} />
        {alertasAvanzadas && <StatCard icon={Activity} label="Tratamientos pendientes" value={tratamientosPendientes.length} color="#6C63C4" onClick={goToPatients} />}
        {costosDisponibles && <StatCard icon={FileText} label="Presupuestos sin aceptar" value={presupuestosSinAceptar.length} color={AMBER} onClick={goToPatients} />}
        {costosDisponibles && <StatCard icon={DollarSign} label="Con saldo pendiente" value={conSaldo.length} color={RED} onClick={goToPatients} />}
        {alertasAvanzadas && <StatCard icon={XCircle} label="Con citas canceladas" value={conCancelaciones.length} color={RED} onClick={goToCitas} />}
      </div>
      {!alertasAvanzadas && (
        <div style={{ marginTop: -14, marginBottom: 24 }}>
          <LockedFeatureNote label="Tratamientos pendientes y citas canceladas" minPlan="premium" />
        </div>
      )}

      <Card style={{ marginBottom: 20 }}>
        <SectionTitle>Pacientes a atender hoy</SectionTitle>

        <div style={{ display: "flex", flexDirection: "column", gap: 10, marginTop: 4 }}>

                </div>
                <StatusPill status={a.status} />
              </div>
            );
          })}
        </div>
      </Card>

      {(sinRegresar.length > 0 || tratamientosPendientes.length > 0 || presupuestosSinAceptar.length > 0 || conSaldo.length > 0 || conCancelaciones.length > 0) && (
        <Card style={{ marginBottom: 20 }}>
          <SectionTitle>Pacientes que necesitan tu atención</SectionTitle>

            {sinRegresar.length > 0 && (
              <AtencionGrupo titulo={`Sin regresar en ${DIAS_SIN_REGRESAR}+ días (${sinRegresar.length})`} color={AMBER}>

                ))}

            )}
            {tratamientosPendientes.length > 0 && (
              <AtencionGrupo titulo={`Tratamientos pendientes (${tratamientosPendientes.length})`} color="#6C63C4">
                {tratamientosPendientes.slice(0, 8).map((pl) => {
                  const paciente = patients.find((p) => p.id === pl.patientId);
                  return (
                    <AtencionFila key={pl.id} onClick={() => paciente && onSelectPatient?.(paciente.id)}
                      nombre={paciente?.name || "—"} detalle={pl.title || "Plan de tratamiento"} />

              <AtencionGrupo titulo={`Presupuestos sin aceptar (${presupuestosSinAceptar.length})`} color={AMBER}>

            {conCancelaciones.length > 0 && (
              <AtencionGrupo titulo={`Con citas canceladas (${conCancelaciones.length})`} color={RED}>
                {conCancelaciones.slice(0, 8).map((r) => (
                  <AtencionFila key={r.patient.id} onClick={() => onSelectPatient?.(r.patient.id)}

              </AtencionGrupo>
            )}
          </div>
        </Card>
      )}

      <Card>
        <SectionTitle>Próximas citas</SectionTitle>
        {proximas.length === 0 && <EmptyNote>No hay citas próximas agendadas.</EmptyNote>}
        <div style={{ display: "flex", flexDirection: "column", gap: 10, marginTop: 4 }}>
          {proximas.map((a) => {
            const prox = coloresActivos ? proximityInfo(a.date) : null;

function formatDateEs(iso) {
  const [y, m, d] = iso.split("-").map(Number);
  return `${d} ${MONTHS_ES[m - 1].slice(0, 3)}`;
}
/* Aviso/banner de citas próximas — se muestra al abrir el Panel general si hay
   citas hoy o mañana (plan Pro en adelante). Se puede cerrar durante la sesión,
   pero vuelve a aparecer la próxima vez que se abra el sistema. */
function CitasProximasBanner({ appointments, patients }) {
  const [dismissed, setDismissed] = useState(false);
  const urgentes = appointments
    .filter((a) => { const d = daysUntil(a.date); return d === 0 || d === 1; })
    .sort((a, b) => (a.date + a.time).localeCompare(b.date + b.time));
  if (dismissed || urgentes.length === 0) return null;
  return (
    <div style={{ background: "#FBF0DF", border: "1px solid #F0D9AE", borderRadius: 12, padding: "14px 16px", marginBottom: 26, display: "flex", alignItems: "flex-start", gap: 12 }}>
      <AlertCircle size={18} color={AMBER} style={{ flexShrink: 0, marginTop: 2 }} />
      <div style={{ flex: 1, minWidth: 0 }}>
        <div style={{ fontWeight: 700, fontSize: 13.5, color: NAVY_DEEP, marginBottom: 6 }}>
          Tienes {urgentes.length} cita{urgentes.length === 1 ? "" : "s"} próxima{urgentes.length === 1 ? "" : "s"}
        </div>
        <div style={{ display: "flex", flexDirection: "column", gap: 3 }}>
          {urgentes.map((a) => (
            <div key={a.id} style={{ fontSize: 12.5, color: "#5B7480" }}>
              <strong style={{ color: NAVY_DEEP }}>{daysUntil(a.date) === 0 ? "Hoy" : "Mañana"}</strong> {a.time} · {patients.find((p) => p.id === a.patientId)?.name || "—"}{a.reason ? ` — ${a.reason}` : ""}
            </div>
          ))}
        </div>
      </div>
      <button onClick={() => setDismissed(true)} title="Cerrar aviso" style={{ background: "transparent", border: "none", color: "#B0906A", padding: 2, flexShrink: 0 }}><X size={16} /></button>
    </div>
  );
}

      </div>
      <Field label="Correo"><input type="email" value={form.email} onChange={set("email")} style={inputStyle} /></Field>
      <Field label="Dirección"><input value={form.address} onChange={set("address")} style={inputStyle} /></Field>
      <Field label="Historial clínico / notas"><textarea rows={3} value={form.history} onChange={set("history")} style={{ ...inputStyle, resize: "vertical" }} /></Field>
      <div style={{ display: "flex", justifyContent: "flex-end", gap: 10, marginTop: 6 }}>
        <button type="button" onClick={onCancel} style={ghostButtonStyle}>Cancelar</button>
        <button type="submit" style={solidButtonStyle}>Guardar paciente</button>
      </div>

}

/* ---------------- Paciente: detalle ---------------- */
function PatientDetail({ patient, appointments, payments, treatmentPlans, prescriptions, doctorProfile, subscriptionPlan, onBack, onUpdateTooth, onAddAppointment, onAddPayment, onAddFile, onAddTreatmentPlan, onUpdateTreatmentPlanStatus, onDeleteTreatmentPlan, onAddPrescription, onDeletePrescription }) {

            <InfoRow label="Edad" value={`${patient.age} años`} />

            <div style={{ fontSize: 12, fontWeight: 700, color: "#5B7480", marginBottom: 6 }}>Historial clínico</div>

          </div>
        </Card>
      )}

  );
}
function InfoRow({ label, value }) {
  return <div><div style={{ fontSize: 12, fontWeight: 700, color: "#5B7480", marginBottom: 3 }}>{label}</div><div>{value || "—"}</div></div>;
}
function FileForm({ onSubmit, onCancel }) {
  const [form, setForm] = useState({ name: "", type: "Radiografía", date: todayISO(), notes: "" });
  return (
    <form onSubmit={(e) => { e.preventDefault(); if (!form.name.trim()) return; onSubmit(form); }} style={{ display: "flex", flexDirection: "column", gap: 12 }}>
      <Field label="Nombre del archivo"><input required value={form.name} onChange={(e) => setForm({ ...form, name: e.target.value })} style={inputStyle} placeholder="Ej. Radiografía panorámica.jpg" /></Field>
      <Field label="Tipo">
        <select value={form.type} onChange={(e) => setForm({ ...form, type: e.target.value })} style={inputStyle}>

        </select>
      </Field>
      <Field label="Fecha"><input type="date" value={form.date} onChange={(e) => setForm({ ...form, date: e.target.value })} style={inputStyle} /></Field>
      <p style={{ fontSize: 12, color: "#8A9BA3", margin: 0 }}>La carga real de archivos requiere conectar Firebase Storage — este registro guarda los metadatos del documento.</p>
      <div style={{ display: "flex", justifyContent: "flex-end", gap: 10 }}>
        <button type="button" onClick={onCancel} style={ghostButtonStyle}>Cancelar</button>

      </div>

  );
}

/* ---------------- Planes de tratamiento y presupuestos ---------------- */
const TREATMENT_STATUSES = ["propuesto", "aceptado", "en_progreso", "completado"];
const TREATMENT_STATUS_LABELS = { propuesto: "Propuesto", aceptado: "Aceptado", en_progreso: "En progreso", completado: "Completado" };
function treatmentStatusColor(s) {
  return {
    propuesto: { bg: "#FBF0DF", fg: AMBER }, aceptado: { bg: "#E3F3EF", fg: "#1E8C6E" },
    en_progreso: { bg: "#E3EEF7", fg: "#2A5C8A" }, completado: { bg: "#EDEFF0", fg: "#5B7480" },
  }[s];
}
function TreatmentPlansTab({ patient, plans, onAdd, onUpdateStatus, onDelete, costosDisponibles }) {
  const [showForm, setShowForm] = useState(false);
  const ordered = plans.slice().sort((a, b) => (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0));
  return (
    <div>
      {!costosDisponibles && (
        <p style={{ fontSize: 12, color: "#8A9BA3", margin: "0 0 14px" }}>
          Aquí llevas el listado de procedimientos por paciente. Los costos y presupuestos en PDF son parte del plan Premium.
        </p>
      )}
      <div style={{ display: "flex", justifyContent: "flex-end", marginBottom: 14 }}>
        <PrimaryButton icon={Plus} onClick={() => setShowForm(true)}>Nuevo plan de tratamiento</PrimaryButton>
      </div>
      {plans.length === 0 && <EmptyNote>Este paciente no tiene planes de tratamiento{costosDisponibles ? " ni presupuestos" : ""} registrados.</EmptyNote>}
      <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
        {ordered.map((pl) => (
          <TreatmentPlanCard key={pl.id} plan={pl} patient={patient} onUpdateStatus={onUpdateStatus} onDelete={onDelete} costosDisponibles={costosDisponibles} />
        ))}
      </div>
      {showForm && (
        <Modal title="Nuevo plan de tratamiento / presupuesto" onClose={() => setShowForm(false)} wide>
          <TreatmentPlanForm onSubmit={(data) => { onAdd(data); setShowForm(false); }} onCancel={() => setShowForm(false)} costosDisponibles={costosDisponibles} />
        </Modal>
      )}
    </div>
  );
}
function TreatmentPlanCard({ plan, patient, onUpdateStatus, onDelete, costosDisponibles }) {
  const items = plan.items || [];
  const total = items.reduce((s, it) => s + (Number(it.cost) || 0), 0);
  function descargarPresupuesto() {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF();
    doc.setFont("helvetica", "bold"); doc.setFontSize(16); doc.setTextColor(18, 46, 74);
    doc.text("DMR System Solutions — Consultorio Dental", 14, 18);
    doc.setFontSize(12); doc.text(`Presupuesto — ${plan.title || "Plan de tratamiento"}`, 14, 26);
    doc.setFont("helvetica", "normal"); doc.setFontSize(10); doc.setTextColor(90, 110, 120);
    doc.text(`Paciente: ${patient.name}`, 14, 33);
    doc.text(`Generado el ${formatDate(todayISO())}`, 14, 38);
    doc.autoTable({
      startY: 46, margin: { left: 14, right: 14 }, theme: "striped",
      head: [["Diente", "Procedimiento", "Costo"]],
      body: items.map((it) => [it.tooth || "—", it.procedure, money(Number(it.cost) || 0)]),
      headStyles: { fillColor: [30, 140, 140] }, styles: { fontSize: 9.5 },
      foot: [["", "Total", money(total)]], footStyles: { fillColor: [18, 46, 74], textColor: 255, fontStyle: "bold" },
    });
    doc.save(`Presupuesto_${patient.name.replace(/\s+/g, "_")}_${todayISO()}.pdf`);
  }
  return (
    <Card>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", gap: 10, flexWrap: "wrap" }}>
        <div>
          <div style={{ fontWeight: 700, fontSize: 14.5 }}>{plan.title || "Plan de tratamiento"}</div>
          <div style={{ fontSize: 12, color: "#8A9BA3", marginTop: 2 }}>
            {items.length} procedimiento{items.length === 1 ? "" : "s"}{costosDisponibles ? ` · Total ${money(total)}` : ""}
          </div>
        </div>
        <div style={{ display: "flex", gap: 8, alignItems: "center" }}>
          {costosDisponibles && (
            <button onClick={descargarPresupuesto} title="Descargar presupuesto en PDF" style={{ background: "transparent", border: "1px solid #DCE6E6", borderRadius: 8, padding: "6px 8px", color: "#5B7480" }}><Download size={14} /></button>
          )}
          <button onClick={() => onDelete(plan.id)} style={{ background: "transparent", border: "none", color: "#C3D0D0" }}><Trash2 size={15} /></button>
        </div>
      </div>
      <div style={{ marginTop: 12, display: "flex", flexDirection: "column", gap: 6 }}>
        {items.map((it, i) => (
          <div key={i} style={{ display: "flex", justifyContent: "space-between", fontSize: 12.5, color: "#5B7480", padding: "4px 0", borderBottom: i < items.length - 1 ? "1px solid #EEF2F2" : "none" }}>
            <span>{it.tooth ? `#${it.tooth} · ` : ""}{it.procedure}</span>
            {costosDisponibles && <span style={{ fontWeight: 700, color: NAVY_DEEP }}>{money(Number(it.cost) || 0)}</span>}
          </div>
        ))}
      </div>
      <div style={{ display: "flex", gap: 6, marginTop: 12, flexWrap: "wrap" }}>
        {TREATMENT_STATUSES.map((s) => (
          <button key={s} onClick={() => onUpdateStatus(plan.id, s)} style={{
            fontSize: 10.5, fontWeight: 700, padding: "4px 9px", borderRadius: 20, border: "1px solid",
            borderColor: plan.status === s ? "transparent" : "#DCE6E6",
            background: plan.status === s ? treatmentStatusColor(s).bg : "#fff",
            color: plan.status === s ? treatmentStatusColor(s).fg : "#8A9BA3" }}>
            {TREATMENT_STATUS_LABELS[s]}
          </button>
        ))}
      </div>
    </Card>
  );
}
function TreatmentPlanForm({ onSubmit, onCancel, costosDisponibles }) {
  const [title, setTitle] = useState("");
  const [items, setItems] = useState([{ tooth: "", procedure: "", cost: "" }]);
  const [error, setError] = useState("");
  const total = items.reduce((s, it) => s + (Number(it.cost) || 0), 0);
  function setItem(i, k, v) { const next = items.slice(); next[i] = { ...next[i], [k]: v }; setItems(next); if (error) setError(""); }
  function addRow() { setItems([...items, { tooth: "", procedure: "", cost: "" }]); }
  function removeRow(i) { setItems(items.filter((_, idx) => idx !== i)); }
  return (
    <form onSubmit={(e) => {
      e.preventDefault();
      const cleanItems = items.filter((it) => it.procedure.trim());
      if (!cleanItems.length) { setError("Agrega al menos un procedimiento con su nombre — sin eso el plan no se puede guardar."); return; }
      onSubmit({ title: title.trim() || "Plan de tratamiento", items: cleanItems.map((it) => ({ ...it, cost: Number(it.cost) || 0 })), status: "propuesto" });
    }} style={{ display: "flex", flexDirection: "column", gap: 12 }}>
      <Field label="Título del plan"><input value={title} onChange={(e) => setTitle(e.target.value)} style={inputStyle} placeholder="Ej. Tratamiento de conducto + corona" /></Field>
      <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
        {items.map((it, i) => (
          <div key={i} className="form-row" style={{ display: "flex", gap: 8, alignItems: "flex-end" }}>
            <Field label="Diente (opcional)"><input value={it.tooth} onChange={(e) => setItem(i, "tooth", e.target.value)} style={{ ...inputStyle, width: 90 }} placeholder="16" /></Field>
            <Field label="Procedimiento *"><input required value={it.procedure} onChange={(e) => setItem(i, "procedure", e.target.value)} style={inputStyle} placeholder="Ej. Obturación" /></Field>
            {costosDisponibles && <Field label="Costo"><input type="number" min="0" value={it.cost} onChange={(e) => setItem(i, "cost", e.target.value)} style={{ ...inputStyle, width: 110 }} /></Field>}
            {items.length > 1 && <button type="button" onClick={() => removeRow(i)} style={{ background: "transparent", border: "none", color: "#C3D0D0", padding: "9px 4px" }}><Trash2 size={15} /></button>}
          </div>
        ))}
        <button type="button" onClick={addRow} style={{ ...ghostButtonStyle, alignSelf: "flex-start", display: "flex", alignItems: "center", gap: 6 }}><Plus size={13} /> Agregar procedimiento</button>
      </div>
      {error && <div style={{ fontSize: 12.5, color: RED, background: "#F7E6E4", borderRadius: 8, padding: "8px 10px" }}>{error}</div>}
      {costosDisponibles && <div style={{ fontSize: 13.5, fontWeight: 700, textAlign: "right" }}>Total: {money(total)}</div>}
      <div style={{ display: "flex", justifyContent: "flex-end", gap: 10, marginTop: 6 }}>
        <button type="button" onClick={onCancel} style={ghostButtonStyle}>Cancelar</button>
        <button type="submit" style={solidButtonStyle}>Guardar plan</button>
      </div>
    </form>
  );
}

/* ---------------- Odontograma ---------------- */

        <div style={{ width: "100%", maxWidth: 720, borderTop: "1.5px dashed #DCE6E6", margin: "10px 0" }} />

        const hasNote = !!(odontogramNotes && odontogramNotes[tooth]);
        return (
          <button key={tooth} className="tooth-btn" onClick={() => onSelectTooth(tooth)} title={`Pieza ${tooth} — ${cfg.label}${hasNote ? " (con nota)" : ""} — clic para editar`}

                <StickyNote size={7} color="#fff" strokeWidth={3} />
              </span>

          </button>
        );
      })}

  );
}

  return (
    <Modal title={`Pieza ${tooth}`} onClose={onClose}>

        <div>
          <div style={{ fontSize: 12, fontWeight: 700, color: "#5B7480", marginBottom: 8 }}>Condición</div>

              </button>
            ))}

        <Field label="Nota de la pieza (opcional)">
          <textarea rows={4} value={selNote} onChange={(e) => setSelNote(e.target.value)} style={{ ...inputStyle, resize: "vertical" }}
            placeholder="Ej. Sensibilidad al frío, revisar en próxima cita…" />

        <div style={{ display: "flex", justifyContent: "flex-end", gap: 10, marginTop: 4 }}>
          <button type="button" onClick={onClose} style={ghostButtonStyle}>Cancelar</button>
          <button type="button" onClick={() => onSave(selState, selNote)} style={solidButtonStyle}>Guardar</button>
        </div>
      </div>
    </Modal>
  );
}

/* ---------------- Citas ---------------- */
function CitasView({ appointments, patients, onAdd, onUpdateStatus, onDelete, subscriptionPlan }) {
  const whatsappDisponible = hasFeature(subscriptionPlan, "whatsapp");
  const coloresActivos = hasFeature(subscriptionPlan, "recordatorios");
  const [cursor, setCursor] = useState(new Date(2026, 8, 1));
  const [selectedDate, setSelectedDate] = useState(todayISO());
  const [showForm, setShowForm] = useState(false);
  const year = cursor.getFullYear(); const month = cursor.getMonth();
  const firstDay = new Date(year, month, 1).getDay();
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const apptsByDate = useMemo(() => { const map = {}; appointments.forEach((a) => { (map[a.date] ||= []).push(a); }); return map; }, [appointments]);
  const cells = []; for (let i = 0; i < firstDay; i++) cells.push(null); for (let d = 1; d <= daysInMonth; d++) cells.push(d);
  const dayAppts = appointments.filter((a) => a.date === selectedDate).sort((a, b) => a.time.localeCompare(b.time));

  return (
    <div>
      <PageHeader title="Citas" subtitle="Calendario y agenda de consultas" action={<PrimaryButton icon={Plus} onClick={() => setShowForm(true)}>Nueva cita</PrimaryButton>} />
      <div className="citas-grid" style={{ display: "grid", gridTemplateColumns: "1.2fr 1fr", gap: 20, alignItems: "start" }}>
        <Card>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 16 }}>
            <button onClick={() => setCursor(new Date(year, month - 1, 1))} style={navButtonStyle}><ChevronLeft size={16} /></button>
            <div style={{ fontFamily: FONT_DISPLAY, fontWeight: 700, fontSize: 15 }}>{MONTHS_ES[month]} {year}</div>
            <button onClick={() => setCursor(new Date(year, month + 1, 1))} style={navButtonStyle}><ChevronRight size={16} /></button>
          </div>
          <div style={{ display: "grid", gridTemplateColumns: "repeat(7, 1fr)", gap: 4, marginBottom: 6 }}>
            {DAYS_ES.map((d) => <div key={d} style={{ textAlign: "center", fontSize: 11, color: "#8A9BA3", fontWeight: 700 }}>{d}</div>)}
          </div>
          <div style={{ display: "grid", gridTemplateColumns: "repeat(7, 1fr)", gap: 4 }}>
            {cells.map((d, i) => {
              if (!d) return <div key={i} />;
              const iso = `${year}-${String(month + 1).padStart(2, "0")}-${String(d).padStart(2, "0")}`;
              const hasAppt = apptsByDate[iso]?.length > 0;
              const isSelected = iso === selectedDate;
              const isToday = iso === todayISO();
              const dotColor = coloresActivos && hasAppt ? proximityInfo(iso).fg : TEAL;
              return (
                <button key={i} onClick={() => setSelectedDate(iso)} style={{
                  aspectRatio: "1", borderRadius: 9, border: isToday ? `1.5px solid ${TEAL}` : "1.5px solid transparent",
                  background: isSelected ? NAVY : "#F5F8F8", color: isSelected ? "#fff" : NAVY_DEEP,
                  fontSize: 13, fontWeight: isSelected ? 700 : 500, position: "relative", display: "flex", alignItems: "center", justifyContent: "center" }}>
                  {d}
                  {hasAppt && <span style={{ position: "absolute", bottom: 5, width: 5, height: 5, borderRadius: "50%", background: isSelected ? "#7EDAD1" : dotColor }} />}
                </button>
              );
            })}
          </div>
        </Card>
        <Card>
          <SectionTitle>{formatDate(selectedDate)}</SectionTitle>
          {dayAppts.length === 0 && <EmptyNote>No hay citas agendadas este día.</EmptyNote>}
          <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
            {dayAppts.map((a) => {
              const patient = patients.find((p) => p.id === a.patientId);
              const prox = coloresActivos ? proximityInfo(a.date) : null;
              return (
                <div key={a.id} style={{ border: "1px solid #E4ECEC", borderLeft: prox ? `4px solid ${prox.fg}` : "1px solid #E4ECEC", borderRadius: 11, padding: 12 }}>
                  <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", gap: 8 }}>
                    <div>
                      <div style={{ fontWeight: 700, fontSize: 13.5 }}>{patient?.name || "—"}</div>
                      <div style={{ fontSize: 12, color: "#5B7480", marginTop: 2, display: "flex", alignItems: "center", gap: 4 }}><Clock size={11} /> {a.time} · {a.reason}</div>
                    </div>
                    <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                      {prox?.label && <ProximityPill dateISO={a.date} />}
                      <button onClick={() => onDelete(a.id)} style={{ background: "transparent", border: "none", color: "#C3D0D0" }}><Trash2 size={14} /></button>
                    </div>
                  </div>
                  <div style={{ display: "flex", gap: 6, marginTop: 10, flexWrap: "wrap", alignItems: "center" }}>
                    {["pendiente", "confirmada", "reagendar_solicitado", "cancelada"].map((s) => (
                      <button key={s} onClick={() => onUpdateStatus(a.id, s)} style={{
                        fontSize: 10.5, fontWeight: 700, padding: "4px 9px", borderRadius: 20, border: "1px solid",
                        borderColor: a.status === s ? "transparent" : "#DCE6E6",
                        background: a.status === s ? statusColor(s).bg : "#fff",
                        color: a.status === s ? statusColor(s).fg : "#8A9BA3" }}>
                        {s === "pendiente" ? "Pendiente" : s === "confirmada" ? "Confirmada" : s === "reagendar_solicitado" ? "Pidió reagendar" : "Cancelada"}
                      </button>
                    ))}
                    {whatsappDisponible
                      ? <WhatsAppButton patientPhone={patient?.phone} patientName={patient?.name} dateISO={a.date} time={a.time} reason={a.reason} type={a.status === "confirmada" ? "reminder" : "confirm"} appointmentId={a.id} confirmToken={a.confirmToken} />
                      : <LockedFeatureNote label="WhatsApp" minPlan="premium" />}
                  </div>
                </div>
              );
            })}
          </div>
        </Card>
      </div>
      {showForm && (
        <Modal title="Nueva cita" onClose={() => setShowForm(false)}>
          <AppointmentForm patients={patients} defaultDate={selectedDate} onSubmit={(data) => { onAdd(data); setShowForm(false); }} onCancel={() => setShowForm(false)} />
        </Modal>
      )}
    </div>
  );
}
function statusColor(s) { return { pendiente: { bg: "#FBF0DF", fg: AMBER }, confirmada: { bg: "#E3F3EF", fg: "#1E8C6E" }, cancelada: { bg: "#F7E6E4", fg: RED }, reagendar_solicitado: { bg: "#EDE9FB", fg: "#6C63C4" } }[s]; }
const navButtonStyle = { width: 30, height: 30, borderRadius: 8, border: "1px solid #DCE6E6", background: "#fff", display: "flex", alignItems: "center", justifyContent: "center", color: NAVY_DEEP };
function AppointmentForm({ patientId, patients, defaultDate, onSubmit, onCancel }) {

      <div style={{ display: "flex", justifyContent: "flex-end", gap: 10, marginTop: 6 }}>

/* ---------------- Reportes (PDF) ---------------- */
function ReportsView({ appointments, payments, patients, }) {
  const [periodType, setPeriodType] = useState("dia");
  const [refDate, setRefDate] = useState(todayISO());
  const [lastGenerated, setLastGenerated] = useState(null);
  const range = getRange(periodType, refDate);

  const citasRango = appointments.filter((a) => a.date >= range.start && a.date <= range.end)
    .sort((a, b) => (a.date + a.time).localeCompare(b.date + b.time));
  const pagosRango = payments.filter((p) => p.date >= range.start && p.date <= range.end);
  const pendientesActuales = payments.filter((p) => p.total - p.paid > 0);

  const totalCobradoRango = pagosRango.reduce((s, p) => s + p.paid, 0);
  const totalFacturadoRango = pagosRango.reduce((s, p) => s + p.total, 0);
  const totalPendienteActual = pendientesActuales.reduce((s, p) => s + (p.total - p.paid), 0);

  function nombrePaciente(id) { return patients.find((p) => p.id === id)?.name || "—"; }

  function generarPDF() {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF();
    const periodLabel = { dia: "Reporte diario", semana: "Reporte semanal", mes: "Reporte mensual" }[periodType];

    doc.setFont("helvetica", "bold");
    doc.setFontSize(16);
    doc.setTextColor(18, 46, 74);
    doc.text("DMR System Solutions — Consultorio Dental", 14, 18);
    doc.setFontSize(12);
    doc.text(periodLabel, 14, 26);
    doc.setFont("helvetica", "normal");
    doc.setFontSize(10);
    doc.setTextColor(90, 110, 120);
    doc.text(range.label, 14, 32);
    doc.text(`Generado el ${formatDate(todayISO())}`, 14, 37);

    let y = 46;

    // Resumen
    doc.setFont("helvetica", "bold"); doc.setFontSize(11); doc.setTextColor(18, 46, 74);
    doc.text("Resumen del periodo", 14, y); y += 4;
    doc.autoTable({
      startY: y, margin: { left: 14, right: 14 }, theme: "grid",
      head: [["Citas en el periodo", "Cobrado en el periodo", "Facturado en el periodo", "Pendiente total actual"]],
      body: [[String(citasRango.length), money(totalCobradoRango), money(totalFacturadoRango), money(totalPendienteActual)]],
      headStyles: { fillColor: [18, 46, 74], fontSize: 8.5 }, styles: { fontSize: 9 },
    });
    y = doc.lastAutoTable.finalY + 12;

    // Citas
    doc.setFont("helvetica", "bold"); doc.setFontSize(11); doc.setTextColor(18, 46, 74);
    doc.text("Citas", 14, y); y += 4;
    if (citasRango.length > 0) {
      doc.autoTable({
        startY: y, margin: { left: 14, right: 14 }, theme: "striped",
        head: [["Fecha", "Hora", "Paciente", "Motivo", "Estado"]],
        body: citasRango.map((a) => [formatDate(a.date), a.time, nombrePaciente(a.patientId), a.reason,
          a.status === "pendiente" ? "Pendiente" : a.status === "confirmada" ? "Confirmada" : a.status === "reagendar_solicitado" ? "Pidió reagendar" : "Cancelada"]),
        headStyles: { fillColor: [30, 140, 140] }, styles: { fontSize: 8.5 },
      });
      y = doc.lastAutoTable.finalY + 12;
    } else {
      doc.setFont("helvetica", "normal"); doc.setFontSize(9.5); doc.setTextColor(140, 150, 155);
      doc.text("No hay citas registradas en este periodo.", 14, y + 4); y += 16;
    }

    // Pagos
    doc.setFont("helvetica", "bold"); doc.setFontSize(11); doc.setTextColor(18, 46, 74);
    doc.text("Pagos registrados en el periodo", 14, y); y += 4;
    if (pagosRango.length > 0) {
      doc.autoTable({
        startY: y, margin: { left: 14, right: 14 }, theme: "striped",
        head: [["Fecha", "Paciente", "Concepto", "Total", "Abonado", "Restante"]],
        body: pagosRango.map((p) => [formatDate(p.date), nombrePaciente(p.patientId), p.description, money(p.total), money(p.paid), money(p.total - p.paid)]),
        headStyles: { fillColor: [30, 140, 140] }, styles: { fontSize: 8.5 },
      });
      y = doc.lastAutoTable.finalY + 12;
    } else {
      doc.setFont("helvetica", "normal"); doc.setFontSize(9.5); doc.setTextColor(140, 150, 155);
      doc.text("No hay pagos registrados en este periodo.", 14, y + 4); y += 16;
    }

    // Pendientes
    if (y > 250) { doc.addPage(); y = 20; }
    doc.setFont("helvetica", "bold"); doc.setFontSize(11); doc.setTextColor(18, 46, 74);
    doc.text("Pendientes de pago (saldo actual, todos los pacientes)", 14, y); y += 4;
    if (pendientesActuales.length > 0) {
      doc.autoTable({
        startY: y, margin: { left: 14, right: 14 }, theme: "striped",
        head: [["Paciente", "Concepto", "Fecha", "Total", "Abonado", "Restante"]],
        body: pendientesActuales.map((p) => [nombrePaciente(p.patientId), p.description, formatDate(p.date), money(p.total), money(p.paid), money(p.total - p.paid)]),
        headStyles: { fillColor: [201, 131, 46] }, styles: { fontSize: 8.5 },
      });
    } else {
      doc.setFont("helvetica", "normal"); doc.setFontSize(9.5); doc.setTextColor(140, 150, 155);
      doc.text("No hay pagos pendientes.", 14, y + 4);
    }

    const filename = `Reporte_${periodType}_${range.start}_a_${range.end}.pdf`;
    doc.save(filename);
    setLastGenerated(filename);
  }

  return (
    <div>
      <PageHeader title="Reportes" subtitle="Genera un PDF de citas, pagos y pendientes por periodo" />
      <Card>
        <div className="reportes-filters" style={{ display: "flex", gap: 20, flexWrap: "wrap", alignItems: "flex-end", marginBottom: 20 }}>
          <Field label="Periodo">
            <div style={{ display: "flex", gap: 8 }}>
              {[["dia", "Día"], ["semana", "Semana"], ["mes", "Mes"]].map(([key, label]) => (
                <button key={key} type="button" onClick={() => setPeriodType(key)} style={{
                  padding: "9px 16px", borderRadius: 9, fontSize: 13, fontWeight: 700,
                  border: `1.5px solid ${periodType === key ? TEAL : "#DCE6E6"}`,
                  background: periodType === key ? "#E3F3EF" : "#fff",
                  color: periodType === key ? "#1E8C6E" : "#5B7480" }}>{label}</button>
              ))}
            </div>
          </Field>
          <Field label="Fecha de referencia">
            <input type="date" value={refDate} onChange={(e) => setRefDate(e.target.value)} style={inputStyle} />
          </Field>
          <PrimaryButton icon={Download} onClick={generarPDF}>Generar PDF</PrimaryButton>
        </div>
        <div style={{ background: "#F0F6F6", borderRadius: 10, padding: 14, fontSize: 13, color: "#5B7480", marginBottom: 18 }}>
          Rango seleccionado: <strong style={{ color: NAVY_DEEP }}>{range.label}</strong>
        </div>
        {lastGenerated && (
          <div style={{ fontSize: 12.5, color: "#1E8C6E", marginBottom: 18 }}>✓ Último PDF descargado: {lastGenerated}</div>
        )}
        <div className="reportes-stats" style={{ display: "grid", gridTemplateColumns: "repeat(3, 1fr)", gap: 16, maxWidth: 640 }}>
          <StatCard icon={CalendarIcon} label="Citas en el rango" value={citasRango.length} color={TEAL} />
          <StatCard icon={CheckCircle2} label="Cobrado en el rango" value={money(totalCobradoRango)} color={"#1E8C6E"} />
          <StatCard icon={AlertCircle} label="Pendiente total actual" value={money(totalPendienteActual)} color={RED} />
        </div>
      </Card>
    </div>
  );
}

  return (
    <div style={{ overflowX: "auto" }}>
    <table style={{ width: "100%", borderCollapse: "collapse", fontSize: 13.5, minWidth: 480 }}>
      <thead>
        <tr style={{ textAlign: "left", color: "#8A9BA3", fontSize: 11.5, fontWeight: 700 }}>
          {showPatient && <th style={thStyle}>Paciente</th>}
          <th style={thStyle}>Concepto</th><th style={thStyle}>Fecha</th><th style={thStyle}>Total</th><th style={thStyle}>Abonado</th><th style={thStyle}>Restante</th>
        </tr>
      </thead>
      <tbody>
        {payments.map((p) => {
          const restante = p.total - p.paid;
          return (
            <tr key={p.id} style={{ borderTop: "1px solid #EEF3F3" }}>
              {showPatient && <td style={tdStyle}>{patients.find((pt) => pt.id === p.patientId)?.name || "—"}</td>}
              <td style={tdStyle}>{p.description}</td>
              <td style={tdStyle}>{formatDate(p.date)}</td>
              <td style={tdStyle}>{money(p.total)}</td>
              <td style={tdStyle}>{money(p.paid)}</td>

        })}
      </tbody>
    </table>
    </div>

const tdStyle = { padding: "10px 10px 10px 0" };

/* ---------------- Pestaña de Pagos: presupuestos con abono/liquidación + pagos sueltos ----------------
   Por default se listan los presupuestos (treatmentPlans) del paciente con su total,
   lo abonado hasta ahora y lo que resta. "Abonado" se calcula sumando los pagos que
   tengan planId === ese plan. Si no hay presupuesto generado, sigue existiendo la
   opción de registrar un pago suelto (sin planId), igual que antes. */
function PagosTab({ patient, payments, treatmentPlans, onAddPayment, costosDisponibles }) {
  const [abonoPlan, setAbonoPlan] = useState(null);
  const [showFreePay, setShowFreePay] = useState(false);
  const plansWithTotals = treatmentPlans.map((pl) => {
    const totalPlan = (pl.items || []).reduce((s, it) => s + (Number(it.cost) || 0), 0);
    const abonado = payments.filter((p) => p.planId === pl.id).reduce((s, p) => s + (Number(p.paid) || 0), 0);
    return { ...pl, totalPlan, abonado, restante: totalPlan - abonado };
  }).sort((a, b) => (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0));
  const freePayments = costosDisponibles ? payments.filter((p) => !p.planId) : payments;
  return (
    <div>
      {costosDisponibles && (
        <React.Fragment>
          <SectionTitle>Presupuestos del paciente</SectionTitle>
          {plansWithTotals.length === 0 && (
            <EmptyNote>Este paciente no tiene presupuestos generados todavía. Puedes crear uno en la pestaña "Planes/Presupuestos", o registrar un pago directo abajo si no aplica un presupuesto.</EmptyNote>
          )}
          <div style={{ display: "flex", flexDirection: "column", gap: 12, marginBottom: 28 }}>
            {plansWithTotals.map((pl) => (
              <Card key={pl.id}>
                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", gap: 10, flexWrap: "wrap" }}>
                  <div>
                    <div style={{ fontWeight: 700, fontSize: 14.5 }}>{pl.title || "Plan de tratamiento"}</div>
                    <div style={{ fontSize: 12.5, color: "#5B7480", marginTop: 4 }}>
                      Total {money(pl.totalPlan)} · Abonado {money(pl.abonado)} ·{" "}
                      <span style={{ fontWeight: 700, color: pl.restante > 0 ? AMBER : "#1E8C6E" }}>
                        {pl.restante > 0 ? `Restan ${money(pl.restante)}` : "Liquidado"}
                      </span>
                    </div>
                  </div>
                  {pl.restante > 0 && (
                    <PrimaryButton icon={Plus} onClick={() => setAbonoPlan(pl)}>Registrar abono</PrimaryButton>
                  )}
                </div>
              </Card>
            ))}
          </div>
        </React.Fragment>
      )}
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 14 }}>
        <SectionTitle>{costosDisponibles ? "Pagos sin presupuesto" : "Pagos"}</SectionTitle>
        <PrimaryButton icon={Plus} onClick={() => setShowFreePay(true)}>Agregar pago</PrimaryButton>
      </div>
      <PaymentsTable payments={freePayments} />
      {abonoPlan && (

}

/* ---------------- Recetas (recetario numerado, con respaldo en Firestore) ----------------
   Cada receta lleva un folio consecutivo por doctor (ver addPrescription/recetaCounter en
   el componente principal) y queda guardada en Firestore como respaldo permanente; desde
   aquí se puede volver a abrir/imprimir en PDF en cualquier momento. */
function folio(n) { return "R-" + String(n || 0).padStart(6, "0"); }
function RecetasTab({ patient, doctorProfile, prescriptions, onAdd, onDelete }) {

        <PrimaryButton icon={Plus} onClick={() => setShowForm(true)}>Nueva receta</PrimaryButton>

      <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
        {ordered.map((r) => (
          <RecetaCard key={r.id} receta={r} patient={patient} doctorProfile={doctorProfile} onDelete={onDelete} />
        ))}
      </div>
      {showForm && (
        <Modal title="Nueva receta" onClose={() => setShowForm(false)} wide>
          <PrescriptionForm onSubmit={(data) => { onAdd(data); setShowForm(false); }} onCancel={() => setShowForm(false)} />
        </Modal>
      )}

}
function PrescriptionForm({ onSubmit, onCancel }) {
  const [diagnosis, setDiagnosis] = useState("");
  const [meds, setMeds] = useState([{ name: "", indication: "" }]);
  const [notes, setNotes] = useState("");
  const [error, setError] = useState("");
  function setMed(i, k, v) { const next = meds.slice(); next[i] = { ...next[i], [k]: v }; setMeds(next); if (error) setError(""); }
  function addRow() { setMeds([...meds, { name: "", indication: "" }]); }
  function removeRow(i) { setMeds(meds.filter((_, idx) => idx !== i)); }
  return (
    <form onSubmit={(e) => {
      e.preventDefault();
      const cleanMeds = meds.filter((m) => m.name.trim());
      if (!cleanMeds.length) { setError("Agrega al menos un medicamento con su nombre — sin eso la receta no se puede guardar."); return; }
      onSubmit({ diagnosis: diagnosis.trim(), notes: notes.trim(), medications: cleanMeds, date: todayISO() });
    }} style={{ display: "flex", flexDirection: "column", gap: 12 }}>
      <Field label="Diagnóstico (opcional)"><input value={diagnosis} onChange={(e) => setDiagnosis(e.target.value)} style={inputStyle} placeholder="Ej. Pulpitis irreversible pieza 36" /></Field>
      <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
        {meds.map((m, i) => (
          <div key={i} className="form-row" style={{ display: "flex", gap: 8, alignItems: "flex-end" }}>
            <Field label="Medicamento *"><input required value={m.name} onChange={(e) => setMed(i, "name", e.target.value)} style={inputStyle} placeholder="Ej. Amoxicilina 500mg" /></Field>
            <Field label="Indicaciones / dosis"><input value={m.indication} onChange={(e) => setMed(i, "indication", e.target.value)} style={inputStyle} placeholder="1 cápsula cada 8h por 7 días" /></Field>
            {meds.length > 1 && <button type="button" onClick={() => removeRow(i)} style={{ background: "transparent", border: "none", color: "#C3D0D0", padding: "9px 4px" }}><Trash2 size={15} /></button>}
          </div>
        ))}
        <button type="button" onClick={addRow} style={{ ...ghostButtonStyle, alignSelf: "flex-start", display: "flex", alignItems: "center", gap: 6 }}><Plus size={13} /> Agregar medicamento</button>
      </div>
      <Field label="Notas / indicaciones generales (opcional)"><input value={notes} onChange={(e) => setNotes(e.target.value)} style={inputStyle} placeholder="Ej. Evitar alimentos duros, revisión en 7 días" /></Field>
      {error && <div style={{ fontSize: 12.5, color: RED, background: "#F7E6E4", borderRadius: 8, padding: "8px 10px" }}>{error}</div>}
      <div style={{ display: "flex", justifyContent: "flex-end", gap: 10, marginTop: 6 }}>
        <button type="button" onClick={onCancel} style={ghostButtonStyle}>Cancelar</button>
        <button type="submit" style={solidButtonStyle}>Guardar receta</button>
      </div>
    </form>
  );
}
function RecetaCard({ receta, patient, doctorProfile, onDelete }) {
  const meds = receta.medications || [];
  // Arma el PDF de la receta y regresa el documento jsPDF listo (sin abrirlo ni
  // imprimirlo todavía) — lo usan tanto "Ver / descargar" como "Imprimir".
  function buildRecetaDoc() {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF();
    const clinicName = doctorProfile?.clinicName || "DMR System Solutions — Consultorio Dental";
    doc.setFont("helvetica", "bold"); doc.setFontSize(16); doc.setTextColor(18, 46, 74);
    doc.text(clinicName, 14, 18);
    doc.setFont("helvetica", "normal"); doc.setFontSize(10); doc.setTextColor(90, 110, 120);
    doc.text(`${doctorProfile?.name || ""}${doctorProfile?.cedula ? " · Céd. Prof. " + doctorProfile.cedula : ""}`, 14, 25);
    doc.setDrawColor(220, 230, 230); doc.line(14, 30, 196, 30);
    doc.setFont("helvetica", "bold"); doc.setFontSize(11); doc.setTextColor(18, 46, 74);
    doc.text(`Receta ${folio(receta.number)}`, 14, 39);
    doc.setFont("helvetica", "normal"); doc.setFontSize(10); doc.setTextColor(90, 110, 120);
    doc.text(`Fecha: ${formatDate(receta.date || todayISO())}`, 150, 39);
    doc.text(`Paciente: ${patient.name}${patient.age ? "  ·  " + patient.age + " años" : ""}`, 14, 46);
    if (receta.diagnosis) doc.text(`Diagnóstico: ${receta.diagnosis}`, 14, 52);
    doc.setFont("helvetica", "bold"); doc.setFontSize(14); doc.setTextColor(30, 140, 140);
    doc.text("Rx", 14, 64);
    doc.autoTable({
      startY: 70, margin: { left: 14, right: 14 }, theme: "striped",
      head: [["Medicamento", "Indicaciones / dosis"]],
      body: meds.map((m) => [m.name, m.indication || "—"]),
      headStyles: { fillColor: [30, 140, 140] }, styles: { fontSize: 10 },
    });
    let y = (doc.lastAutoTable?.finalY || 80) + 12;
    if (receta.notes) {
      doc.setFont("helvetica", "normal"); doc.setFontSize(9.5); doc.setTextColor(90, 110, 120);
      doc.text(doc.splitTextToSize(`Indicaciones generales: ${receta.notes}`, 182), 14, y); y += 16;
    }
    y = Math.max(y, 240);
    doc.setDrawColor(180, 190, 190); doc.line(70, y, 140, y);
    doc.setFontSize(9.5); doc.setTextColor(90, 110, 120); doc.text("Firma y sello", 90, y + 6);
    return doc;
  }
  // "Ver / descargar": abre el PDF en una pestaña nueva, tal como antes.
  function verReceta() {
    window.open(buildRecetaDoc().output("bloburl"), "_blank");
  }
  // "Imprimir": manda el PDF directo al diálogo de impresión del navegador — desde
  // ahí el doctor puede imprimir en su impresora predeterminada o elegir/ajustar
  // otra impresora, sin tener que abrir primero el PDF y buscar la opción manualmente.
  function imprimirReceta() {
    const blobUrl = buildRecetaDoc().output("bloburl");
    const iframe = document.createElement("iframe");
    iframe.style.position = "fixed";
    iframe.style.right = "0"; iframe.style.bottom = "0";
    iframe.style.width = "0"; iframe.style.height = "0";
    iframe.style.border = "0";
    iframe.src = blobUrl;
    document.body.appendChild(iframe);
    iframe.onload = () => {
      setTimeout(() => {
        try {
          iframe.contentWindow.focus();
          iframe.contentWindow.print();
        } catch (err) {
          // Si el navegador bloquea la impresión desde el iframe, se abre el PDF
          // en una pestaña nueva para que el doctor lo imprima desde ahí.
          window.open(blobUrl, "_blank");
        }
        setTimeout(() => { document.body.removeChild(iframe); }, 2000);
      }, 300);
    };
  }
  return (
    <Card>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", gap: 10, flexWrap: "wrap" }}>
        <div>
          <div style={{ fontWeight: 700, fontSize: 14.5 }}>{folio(receta.number)}</div>
          <div style={{ fontSize: 12, color: "#8A9BA3", marginTop: 2 }}>
            {formatDate(receta.date || todayISO())} · {meds.length} medicamento{meds.length === 1 ? "" : "s"}{receta.diagnosis ? ` · ${receta.diagnosis}` : ""}
          </div>
        </div>
        <div style={{ display: "flex", gap: 8, alignItems: "center" }}>
          <button onClick={verReceta} title="Ver / descargar receta en PDF" style={{ background: "transparent", border: "1px solid #DCE6E6", borderRadius: 8, padding: "6px 8px", color: "#5B7480" }}><Download size={14} /></button>
          <button onClick={imprimirReceta} title="Imprimir (elegir impresora predeterminada u otra)" style={{ background: "transparent", border: "1px solid #DCE6E6", borderRadius: 8, padding: "6px 8px", color: "#5B7480" }}><Printer size={14} /></button>
          <button onClick={() => onDelete(receta.id)} style={{ background: "transparent", border: "none", color: "#C3D0D0" }}><Trash2 size={15} /></button>
        </div>
      </div>
      <div style={{ marginTop: 12, display: "flex", flexDirection: "column", gap: 6 }}>
        {meds.map((m, i) => (
          <div key={i} style={{ fontSize: 12.5, color: "#5B7480", padding: "4px 0", borderBottom: i < meds.length - 1 ? "1px solid #EEF2F2" : "none" }}>
            <span style={{ fontWeight: 700, color: NAVY_DEEP }}>{m.name}</span>{m.indication ? ` — ${m.indication}` : ""}
          </div>
        ))}
      </div>
    </Card>
  );
}
