/* Tarjeta de notificaciones push, dentro de Ajustes. El doctor solo activa
   (o desactiva) las notificaciones EN ESTE dispositivo — el horario de los
   avisos (día antes / mismo día) lo define el administrador desde
   "Administración" y aquí se muestra de forma informativa, sin poder
   editarse. */
function NotificationsCard({ profile, currentUid, onActivar }) {
  const [estado, setEstado] = useState("idle"); // idle | activando | ok | error
  const [errorMsg, setErrorMsg] = useState("");
  const tokens = profile?.fcmTokens || [];
  const permisoNavegador = (typeof Notification !== "undefined") ? Notification.permission : "unsupported";
  const yaActivo = permisoNavegador === "granted" && tokens.length > 0;
  const soportado = typeof window !== "undefined" && "Notification" in window && "serviceWorker" in navigator;
  const notify = profile?.notifySettings || {};
  async function handleActivar() {
    setEstado("activando"); setErrorMsg("");
    try { await onActivar(); setEstado("ok"); }
    catch (err) { setEstado("error"); setErrorMsg(err.message || "No se pudo activar."); }
  }
  return (
    <Card>
      <SectionTitle>Notificaciones</SectionTitle>
      {!soportado && (
        <p style={{ fontSize: 12.5, color: "#8A9BA3", margin: 0 }}>
          Este navegador no soporta notificaciones push. Prueba con Chrome o Edge (o, en iPhone, agrega
          la app a tu pantalla de inicio primero).
        </p>
      )}
      {soportado && (
        <>
          <p style={{ fontSize: 13, color: "#5B7480", marginTop: 0, marginBottom: 14, lineHeight: 1.5 }}>
            Activa las notificaciones para recibir un aviso en este dispositivo — aunque tengas la app
            cerrada — con tus citas de hoy y de mañana. El horario de esos avisos lo configura tu
            administrador; aquí solo activas/revisas este dispositivo.
          </p>
          {!yaActivo && (
            <button onClick={handleActivar} disabled={estado === "activando"} style={{ ...solidButtonStyle, opacity: estado === "activando" ? 0.7 : 1 }}>
              {estado === "activando" ? "Activando…" : "Activar notificaciones en este dispositivo"}
            </button>
          )}
          {yaActivo && (
            <div style={{ display: "flex", alignItems: "center", gap: 8, fontSize: 13, color: "#1E8C6E" }}>
              <CheckCircle2 size={16} color="#1E8C6E" /> Notificaciones activas en este dispositivo
              {tokens.length > 1 && <span style={{ color: "#8A9BA3" }}>· {tokens.length} dispositivos con notificaciones activas</span>}
            </div>
          )}
          {permisoNavegador === "denied" && (
            <p style={{ fontSize: 12, color: RED, marginTop: 10 }}>
              Bloqueaste las notificaciones para este sitio en tu navegador. Para activarlas, cambia el
              permiso desde el ícono de sitio junto a la barra de direcciones.
            </p>
          )}
          {estado === "error" && <p style={{ fontSize: 12, color: RED, marginTop: 10 }}>{errorMsg}</p>}
          <div style={{ marginTop: 16, paddingTop: 14, borderTop: "1px solid #EEF3F3", fontSize: 12.5, color: "#5B7480" }}>
            <div style={{ marginBottom: 4 }}><strong>Horario configurado por tu administrador:</strong></div>
            {!notify.enabled && <div>Aún no tienes recordatorios configurados — pide a tu administrador que los active desde "Administración".</div>}
            {notify.enabled && (
              <div>
                {notify.dayBeforeTime && <div>· Aviso de citas de mañana: {notify.dayBeforeTime}</div>}
                {notify.sameDayTime && <div>· Aviso de citas de hoy: {notify.sameDayTime}</div>}
                {!notify.dayBeforeTime && !notify.sameDayTime && <div>Activado, pero sin horarios definidos todavía.</div>}
              </div>
            )}
          </div>
        </>
      )}
    </Card>
  );
}

/* ---------------- Administración (solo dueño del sistema) ---------------- */
function AdminView({ currentUid }) {
  const [doctors, setDoctors] = useState([]);
  const [loading, setLoading] = useState(true);
  const [error, setError] = useState("");
  const [migrating, setMigrating] = useState(false);
  useEffect(() => {
    const unsub = db.collection("doctors").onSnapshot((snap) => {
      setDoctors(snap.docs.map((d) => ({ id: d.id, ...d.data() })));
      setLoading(false);
    }, (err) => { console.error("Error leyendo doctores:", err); setError("No se pudo cargar la lista de doctores."); setLoading(false); });
    return unsub;
  }, []);
  function cambiarPlan(uid, newPlan) {
    db.collection("doctors").doc(uid).set({ plan: newPlan }, { merge: true })
      .catch((err) => console.error("Error al actualizar el plan:", err));
  }
  function guardarHorarioNotificaciones(uid, notifySettings) {
    return db.collection("doctors").doc(uid).set({ notifySettings }, { merge: true });
  }
  function cambiarAcceso(uid, disabled) {
    if (disabled && !confirm("¿Suspender el acceso de este doctor? Se cerrará su sesión de inmediato y no podrá entrar hasta que se lo reactives.")) return;
    db.collection("doctors").doc(uid).set({ disabled }, { merge: true })
      .catch((err) => console.error("Error al cambiar el acceso del doctor:", err));
  }
  const doctoresPro = doctors.filter((d) => d.plan === "pro");
  async function migrarProAPremium() {
    setMigrating(true);
    try {
      const batch = db.batch();
      doctoresPro.forEach((d) => batch.update(db.collection("doctors").doc(d.id), { plan: "premium" }));
      await batch.commit();
    } catch (err) { console.error("Error al migrar doctores de Pro a Premium:", err); }
    finally { setMigrating(false); }
  }
  return (
    <div>
      <PageHeader title="Administración" subtitle="Activa o desactiva funciones por doctor según su plan contratado" />
      {error && <p style={{ color: RED, fontSize: 13 }}>{error}</p>}
      {loading && <EmptyNote>Cargando doctores…</EmptyNote>}
      {!loading && doctoresPro.length > 0 && (
        <div style={{ background: "#FBF0DF", border: "1px solid #F0D9AE", borderRadius: 12, padding: "12px 16px", marginBottom: 18, display: "flex", justifyContent: "space-between", alignItems: "center", flexWrap: "wrap", gap: 10 }}>
          <div style={{ fontSize: 12.5, color: NAVY_DEEP }}>
            El plan Pro ya no existe — <strong>{doctoresPro.length} doctor{doctoresPro.length === 1 ? "" : "es"}</strong> lo sigue{doctoresPro.length === 1 ? "" : "n"} teniendo asignado
            (funcionan igual que Premium mientras tanto). Puedes normalizar su registro aquí.
          </div>
          <button onClick={migrarProAPremium} disabled={migrating} style={{ ...solidButtonStyle, fontSize: 12, padding: "8px 14px", opacity: migrating ? 0.6 : 1 }}>
            {migrating ? "Actualizando…" : `Pasar ${doctoresPro.length === 1 ? "ese doctor" : "esos doctores"} a Premium`}
          </button>
        </div>
      )}
      {!loading && doctors.length === 0 && <EmptyNote>Aún no hay doctores registrados.</EmptyNote>}
      <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
        {doctors.map((doc) => (
          <Card key={doc.id}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", flexWrap: "wrap", gap: 12 }}>
              <div>
                <div style={{ fontWeight: 700, fontSize: 14.5 }}>
                  {doc.name || "—"} {doc.id === currentUid && <span style={{ fontSize: 11, color: TEAL }}>(tú)</span>}
                  {doc.disabled === true && <span style={{ fontSize: 10.5, fontWeight: 700, color: RED, background: "#F7E6E4", borderRadius: 8, padding: "2px 8px", marginLeft: 8 }}>Acceso suspendido</span>}
                </div>
                <div style={{ fontSize: 12.5, color: "#5B7480", marginTop: 2 }}>@{doc.username || "—"} · {doc.email || "—"}</div>
              </div>
              <div style={{ display: "flex", gap: 6, alignItems: "center", flexWrap: "wrap" }}>
                {PLAN_ORDER.map((p) => {
                  const activo = p === "premium" ? PLAN_RANK[doc.plan || "basico"] >= PLAN_RANK.premium : (doc.plan || "basico") === p;
                  return (
                    <button key={p} onClick={() => cambiarPlan(doc.id, p)} style={{
                      fontSize: 11.5, fontWeight: 700, padding: "6px 12px", borderRadius: 20, border: "1px solid",
                      borderColor: activo ? "transparent" : "#DCE6E6",
                      background: activo ? "#E3F3EF" : "#fff",
                      color: activo ? "#1E8C6E" : "#8A9BA3" }}>
                      {PLAN_LABELS[p]}
                    </button>
                  );
                })}
                {doc.id !== currentUid && (
                  doc.disabled === true ? (
                    <button onClick={() => cambiarAcceso(doc.id, false)} style={{ display: "flex", alignItems: "center", gap: 6, fontSize: 11.5, fontWeight: 700, padding: "6px 12px", borderRadius: 20, border: "1px solid transparent", background: "#E3F3EF", color: "#1E8C6E" }}>
                      <ShieldCheck size={13} /> Reactivar acceso
                    </button>
                  ) : (
                    <button onClick={() => cambiarAcceso(doc.id, true)} style={{ display: "flex", alignItems: "center", gap: 6, fontSize: 11.5, fontWeight: 700, padding: "6px 12px", borderRadius: 20, border: "1px solid #E8C4C0", background: "#fff", color: RED }}>
                      <ShieldOff size={13} /> Suspender acceso
                    </button>
                  )
                )}
              </div>
            </div>
            <NotifyScheduleEditor doctorId={doc.id} notifySettings={doc.notifySettings}
              tokenCount={(doc.fcmTokens || []).length}
              onSave={(settings) => guardarHorarioNotificaciones(doc.id, settings)} />
          </Card>
        ))}
      </div>
    </div>
  );
}

/* Editor, por doctor, del horario de recordatorios push (citas de mañana /
   citas de hoy). Solo lo ve y edita el administrador — el doctor solo activa
   notificaciones en su dispositivo desde Ajustes, pero no puede cambiar el
   horario. Las horas se guardan en punto o cuarto de hora (00/15/30/45) porque
   la función programada en el servidor revisa cada 15 minutos. */
function NotifyScheduleEditor({ doctorId, notifySettings, tokenCount, onSave }) {
  const [enabled, setEnabled] = useState(notifySettings?.enabled || false);
  const [dayBeforeTime, setDayBeforeTime] = useState(notifySettings?.dayBeforeTime || "");
  const [sameDayTime, setSameDayTime] = useState(notifySettings?.sameDayTime || "");
  const [saving, setSaving] = useState(false);
  const [saved, setSaved] = useState(false);
  useEffect(() => {
    setEnabled(notifySettings?.enabled || false);
    setDayBeforeTime(notifySettings?.dayBeforeTime || "");
    setSameDayTime(notifySettings?.sameDayTime || "");
  }, [notifySettings?.enabled, notifySettings?.dayBeforeTime, notifySettings?.sameDayTime]);
  async function handleGuardar() {
    setSaving(true);
    try {
      await onSave({ enabled, dayBeforeTime: dayBeforeTime || null, sameDayTime: sameDayTime || null });
      setSaved(true); setTimeout(() => setSaved(false), 2000);
    } catch (err) { console.error("Error al guardar horario de notificaciones:", err); }
    finally { setSaving(false); }
  }
  return (
    <div style={{ marginTop: 14, paddingTop: 14, borderTop: "1px solid #EEF3F3" }}>
      <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 10 }}>
        <label style={{ display: "flex", alignItems: "center", gap: 6, fontSize: 12.5, fontWeight: 700, color: NAVY_DEEP }}>
          <input type="checkbox" checked={enabled} onChange={(e) => setEnabled(e.target.checked)} />
          Recordatorios push de citas
        </label>
        <span style={{ fontSize: 11, color: tokenCount > 0 ? "#1E8C6E" : "#B0BEC5" }}>
          {tokenCount > 0 ? `· ${tokenCount} dispositivo${tokenCount === 1 ? "" : "s"} con notificaciones activas` : "· el doctor aún no activa notificaciones en ningún dispositivo"}
        </span>
      </div>
      <div style={{ display: "flex", gap: 16, flexWrap: "wrap", alignItems: "flex-end" }}>
        <Field label="Aviso de citas de MAÑANA (un día antes)">
          <input type="time" step="900" value={dayBeforeTime} onChange={(e) => setDayBeforeTime(e.target.value)}
            disabled={!enabled} style={{ ...inputStyle, opacity: enabled ? 1 : 0.5 }} />
        </Field>
        <Field label="Aviso de citas de HOY (el mismo día)">
          <input type="time" step="900" value={sameDayTime} onChange={(e) => setSameDayTime(e.target.value)}
            disabled={!enabled} style={{ ...inputStyle, opacity: enabled ? 1 : 0.5 }} />
        </Field>
        <div style={{ display: "flex", alignItems: "center", gap: 8, paddingBottom: 4 }}>
          {saved && <span style={{ fontSize: 12, color: "#1E8C6E" }}>✓ Guardado</span>}
          <button onClick={handleGuardar} disabled={saving} style={{ ...solidButtonStyle, fontSize: 12, padding: "8px 14px", opacity: saving ? 0.6 : 1 }}>
            {saving ? "Guardando…" : "Guardar horario"}
          </button>
        </div>
      </div>
      <p style={{ fontSize: 11, color: "#B0BEC5", marginTop: 6, marginBottom: 0 }}>
        Las horas se redondean a cuartos de hora (:00, :15, :30, :45) — la hora se aplica según la zona
        horaria del servidor (ver README). Deja un campo vacío para no enviar ese aviso.
      </p>
    </div>
  );
}

function AuthScreen() {
  const [mode, setMode] = useState("login"); // "login" | "register"
  const [error, setError] = useState("");
  const [loading, setLoading] = useState(false);
  const [inactivityNotice, setInactivityNotice] = useState(false);
  const [suspendedNotice, setSuspendedNotice] = useState(false);
  useEffect(() => {
    try {
      const razon = sessionStorage.getItem("dmr_logout_reason");
      if (razon === "inactividad") setInactivityNotice(true);
      if (razon === "suspendido") setSuspendedNotice(true);
      if (razon) sessionStorage.removeItem("dmr_logout_reason");
    } catch (e) {}
  }, []);

  // onAuthStateChanged en DentalApp detecta el login/registro automáticamente
  // y cambia de pantalla; aquí solo disparamos la llamada a Firebase Auth.
  // El acceso admite usuario O correo: si lo que se escribió no trae "@", se
  // busca primero en la colección pública "usernames" el correo asociado.
  async function handleLogin({ identifier, password }) {
    setError(""); setLoading(true);
    try {
      let email = identifier.trim();
      if (!email.includes("@")) {
        const uname = email.toLowerCase();
        const snap = await db.collection("usernames").doc(uname).get();
        if (!snap.exists) throw { code: "auth/user-not-found" };
        email = snap.data().email;
      }
      await auth.signInWithEmailAndPassword(email, password);
    } catch (err) {
      setError(mapAuthError(err.code));
    } finally { setLoading(false); }
  }
  async function handleRegister({ name, username, email, password }) {
    setError(""); setLoading(true);
    try {
      const uname = username.trim().toLowerCase();
      if (!/^[a-z0-9._-]{3,20}$/.test(uname)) throw { code: "auth/invalid-username" };
      const existing = await db.collection("usernames").doc(uname).get();
      if (existing.exists) throw { code: "auth/username-taken" };
      const cred = await auth.createUserWithEmailAndPassword(email.trim(), password);
      await cred.user.updateProfile({ displayName: name.trim() });
      await db.collection("usernames").doc(uname).set({ uid: cred.user.uid, email: email.trim() });
      await db.collection("doctors").doc(cred.user.uid).set({
        name: name.trim(), username: uname, email: email.trim(), whatsappNumber: "", plan: "basico",
        createdAt: firebase.firestore.FieldValue.serverTimestamp(),
      });
    } catch (err) {
      setError(mapAuthError(err.code));
    } finally { setLoading(false); }
  }

  return (
    <div style={{ minHeight: "100vh", display: "flex", alignItems: "center", justifyContent: "center", background: NAVY_DEEP, padding: 20 }}>
      <div className="auth-box" style={{ width: 400, maxWidth: "100%", background: "#fff", borderRadius: 18, padding: "34px 32px", boxShadow: "0 20px 60px rgba(0,0,0,0.35)" }}>
        <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 26 }}>
          <LogoMark size={36} />
          <div>
            <div style={{ fontFamily: FONT_DISPLAY, fontWeight: 700, fontSize: 16, color: NAVY_DEEP, lineHeight: 1.1 }}>DMR</div>
            <div style={{ fontSize: 11, color: TEAL, fontWeight: 600 }}>System Solutions</div>
          </div>
        </div>
        {inactivityNotice && (
          <div style={{ fontSize: 12, color: "#8A6A2D", background: "#FBF0DF", border: "1px solid #F0D9AE", borderRadius: 10, padding: "9px 12px", marginBottom: 16 }}>
            Tu sesión se cerró por inactividad, por seguridad. Vuelve a iniciar sesión.
          </div>
        )}
        {suspendedNotice && (
          <div style={{ fontSize: 12, color: "#8A2D2D", background: "#F7E6E4", border: "1px solid #E8C4C0", borderRadius: 10, padding: "9px 12px", marginBottom: 16 }}>
            Tu acceso fue suspendido por el administrador. Contáctalo si crees que es un error.
          </div>
        )}
        <h1 style={{ fontFamily: FONT_DISPLAY, fontSize: 21, fontWeight: 700, color: NAVY_DEEP, margin: "0 0 4px" }}>
          {mode === "login" ? "Iniciar sesión" : "Crear cuenta"}
        </h1>
        <p style={{ fontSize: 13, color: "#5B7480", margin: "0 0 22px" }}>
          {mode === "login" ? "Accede al panel de tu consultorio dental." : "Registra tu acceso al panel de tu consultorio dental."}
        </p>
        {mode === "login"
          ? <LoginForm onSubmit={handleLogin} loading={loading} />
          : <RegisterForm onSubmit={handleRegister} loading={loading} />}
        {error && <p style={{ color: RED, fontSize: 12.5, marginTop: 12 }}>{error}</p>}
        <div style={{ textAlign: "center", marginTop: 20, fontSize: 13, color: "#5B7480" }}>
          {mode === "login" ? (
            <>¿No tienes cuenta?{" "}
              <button onClick={() => { setMode("register"); setError(""); }} style={{ background: "transparent", border: "none", color: TEAL, fontWeight: 700, padding: 0 }}>Regístrate</button>
            </>
          ) : (
            <>¿Ya tienes cuenta?{" "}
              <button onClick={() => { setMode("login"); setError(""); }} style={{ background: "transparent", border: "none", color: TEAL, fontWeight: 700, padding: 0 }}>Inicia sesión</button>
            </>
          )}
        </div>
        <p style={{ fontSize: 11, color: "#B0BEC5", marginTop: 22, lineHeight: 1.5 }}>
          Tu cuenta y tus datos se guardan en la nube (Firebase), así que puedes iniciar sesión con el mismo correo desde cualquier computadora o celular.
        </p>
      </div>
    </div>
  );
}
function LoginForm({ onSubmit, loading }) {
  const [form, setForm] = useState({ identifier: "", password: "" });
  return (
    <form onSubmit={(e) => { e.preventDefault(); if (!form.identifier.trim() || !form.password) return; onSubmit(form); }} style={{ display: "flex", flexDirection: "column", gap: 12 }}>
      <Field label="Usuario o correo"><input required value={form.identifier} onChange={(e) => setForm({ ...form, identifier: e.target.value })} style={inputStyle} placeholder="tu.usuario o tucorreo@ejemplo.com" /></Field>
      <Field label="Contraseña"><input type="password" required value={form.password} onChange={(e) => setForm({ ...form, password: e.target.value })} style={inputStyle} placeholder="••••••••" /></Field>
      <button type="submit" disabled={loading} style={{ ...solidButtonStyle, display: "flex", alignItems: "center", justifyContent: "center", gap: 8, padding: "11px 18px", fontSize: 14, marginTop: 6, opacity: loading ? 0.7 : 1 }}>
        <Lock size={15} /> {loading ? "Entrando…" : "Entrar"}
      </button>
    </form>
  );
}
function RegisterForm({ onSubmit, loading }) {
  const [form, setForm] = useState({ name: "", username: "", email: "", password: "", confirm: "" });
  const [localError, setLocalError] = useState("");
  return (
    <form onSubmit={(e) => {
      e.preventDefault();
      if (!form.name.trim() || !form.username.trim() || !form.email.trim() || !form.password) return;
      if (!/^[a-zA-Z0-9._-]{3,20}$/.test(form.username.trim())) { setLocalError("El usuario debe tener 3–20 caracteres: letras, números, puntos o guiones."); return; }
      if (form.password.length < 6) { setLocalError("La contraseña debe tener al menos 6 caracteres."); return; }
      if (form.password !== form.confirm) { setLocalError("Las contraseñas no coinciden."); return; }
      setLocalError("");
      onSubmit(form);
    }} style={{ display: "flex", flexDirection: "column", gap: 12 }}>
      <Field label="Nombre completo"><input required value={form.name} onChange={(e) => setForm({ ...form, name: e.target.value })} style={inputStyle} /></Field>
      <Field label="Nombre de usuario"><input required value={form.username} onChange={(e) => setForm({ ...form, username: e.target.value })} style={inputStyle} placeholder="Ej. dra.perez" /></Field>
      <Field label="Correo"><input type="email" required value={form.email} onChange={(e) => setForm({ ...form, email: e.target.value })} style={inputStyle} placeholder="tucorreo@ejemplo.com" /></Field>
      <Field label="Contraseña"><input type="password" required value={form.password} onChange={(e) => setForm({ ...form, password: e.target.value })} style={inputStyle} placeholder="••••••••" /></Field>
      <Field label="Confirmar contraseña"><input type="password" required value={form.confirm} onChange={(e) => setForm({ ...form, confirm: e.target.value })} style={inputStyle} placeholder="••••••••" /></Field>
      {localError && <p style={{ color: RED, fontSize: 12.5, margin: 0 }}>{localError}</p>}
      <button type="submit" disabled={loading} style={{ ...solidButtonStyle, display: "flex", alignItems: "center", justifyContent: "center", gap: 8, padding: "11px 18px", fontSize: 14, marginTop: 6, opacity: loading ? 0.7 : 1 }}>
        <UserPlus size={15} /> {loading ? "Creando…" : "Crear cuenta"}
      </button>
    </form>
  );
}
